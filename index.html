<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>64 quarks</title>
  </head>
  <body>
    <main>
      <div class="board-area">
        <div class="board-and-panel">
          <div class="board-column">
            <div class="brand-watermark"><span>64 quarks</span></div>
            <div class="board-frame">
              <div class="coords-files" id="coords-files-top"></div>
              <div class="coords-ranks" id="coords-ranks-left"></div>
              <div id="board"></div>
              <div class="coords-ranks" id="coords-ranks-right"></div>
              <div class="move-indicator turn-black" id="move-indicator" title="Side to move"></div>
              <div class="coords-files" id="coords-files-bottom"></div>
            </div>
          </div>
          <aside class="side-info-panel">
            <div class="side-inner-panel">
              <div class="analysis-section">
                <div class="analysis-panel-body">
                  <div class="analysis-placeholder">Analysis coming soon</div>
                </div>
              </div>
              <div class="movies-section">
                <div class="movies-panel-body">
                  <div id="move-list" class="move-list" aria-label="Move list"></div>
                </div>
                <div id="move-selector" class="move-selector" role="group" aria-label="Choose next move" hidden></div>
                <div class="movies-panel-footer">
                  <div class="nav-buttons" role="group" aria-label="Position navigation">
                    <button id="nav-first" type="button" title="Move to the first position" aria-label="Move to the first position">
                      <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M17 6l-6 6 6 6M8 6v12" />
                      </svg>
                    </button>
                    <button id="nav-prev" type="button" title="Previous position" aria-label="Go to previous position">
                      <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M15 6l-6 6 6 6" />
                      </svg>
                    </button>
                    <button id="nav-next" type="button" title="Next position" aria-label="Go to next position">
                      <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M9 6l6 6-6 6" />
                      </svg>
                    </button>
                    <button id="nav-last" type="button" title="Move to the last position" aria-label="Move to the last position">
                      <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M7 6l6 6-6 6M16 6v12" />
                      </svg>
                    </button>
                  </div>
                  <div class="nav-buttons panel-action-buttons" role="group" aria-label="Position actions">
                    <button id="import-btn" type="button" title="Import FEN or PGN" aria-label="Import FEN or PGN">
                      <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M12 15V3m0 0L7 8m5-5 5 5M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6" /></svg>
                    </button>
                    <button id="lichess-btn" type="button" title="Analyze on Lichess" aria-label="Analyze on Lichess">
                      <svg viewBox="0 0 50 50" aria-hidden="true"><path fill="currentColor" d="M38.956.5c-3.53.418-6.452.902-9.286 2.984C5.534 1.786-.692 18.533.68 29.364 3.493 50.214 31.918 55.785 41.329 41.7c-7.444 7.696-19.276 8.752-28.323 3.084S-.506 27.392 4.683 17.567C9.873 7.742 18.996 4.535 29.03 6.405c2.43-1.418 5.225-3.22 7.655-3.187l-1.694 4.86 12.752 21.37c-.439 5.654-5.459 6.112-5.459 6.112-.574-1.47-1.634-2.942-4.842-6.036-3.207-3.094-17.465-10.177-15.788-16.207-2.001 6.967 10.311 14.152 14.04 17.663 3.73 3.51 5.426 6.04 5.795 6.756 0 0 9.392-2.504 7.838-8.927L37.4 7.171z" /></svg>
                    </button>
                  </div>
                </div>
              </div>
            </div>
          </aside>
        </div>
      </div>
    </main>
    <div id="move-context-menu" class="move-context-menu" role="menu" hidden></div>
    <div id="import-dialog" class="import-dialog" role="dialog" aria-modal="true" aria-labelledby="import-dialog-title" hidden>
      <div class="import-dialog-panel">
        <h2 id="import-dialog-title">Import FEN or PGN</h2>
        <textarea id="import-input" rows="7" spellcheck="false" autocomplete="off" placeholder="Paste a FEN or PGN..."></textarea>
        <p id="import-error" class="import-error" hidden>Paste a valid FEN or PGN.</p>
        <div class="import-dialog-actions">
          <button id="import-cancel" type="button">Cancel</button>
          <button id="import-confirm" type="button">Import</button>
        </div>
      </div>
    </div>
    <div id="delete-dialog" class="delete-dialog" role="dialog" aria-modal="true" aria-labelledby="delete-dialog-title" hidden>
      <div class="delete-dialog-panel">
        <h2 id="delete-dialog-title">Delete moves?</h2>
        <p id="delete-dialog-message"></p>
        <div class="delete-dialog-actions">
          <button id="delete-cancel" type="button">Cancel</button>
          <button id="delete-confirm" type="button">Delete</button>
        </div>
      </div>
    </div>
    <div id="promotion" class="promotion" hidden>
      <div class="promotion-menu" id="promotion-menu" role="dialog" aria-label="Choose promotion piece"></div>
    </div>
    <div class="timer-widget">
      <button id="timer-toggle" type="button" title="Show timer" aria-label="Show timer" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M12 7v5l3 2M9 2h6M12 4a8 8 0 1 0 0 16 8 8 0 0 0 0-16Z" />
        </svg>
      </button>
      <div id="timer-panel" class="timer-panel" hidden>
        <span id="timer-display" class="timer-display">00:00</span>
        <button id="timer-restart" type="button" title="Restart (Alt+T, R)" aria-label="Restart">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M3 12a9 9 0 1 0 3-6.7" />
            <polyline fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" points="3 4 3 9 8 9" />
          </svg>
        </button>
        <button id="timer-startpause" type="button" title="Start (Alt+T, S) / Pause (Alt+T, P)" aria-label="Start / pause">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <polygon fill="currentColor" points="5 3 19 12 5 21 5 3" />
          </svg>
        </button>
        <button id="timer-reset" type="button" title="Clear (Alt+T, C)" aria-label="Clear">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="6" y="6" width="12" height="12" rx="2" ry="2" fill="currentColor" />
          </svg>
        </button>
      </div>
    </div>
    <div class="settings-widget">
      <button id="settings-toggle" type="button" title="Settings" aria-label="Settings" aria-expanded="false" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z" />
          <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h.09a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h.09a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v.09a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" />
        </svg>
      </button>
      <div id="settings-menu" class="settings-menu" role="menu" hidden>
        <div class="settings-header">Settings</div>
        <label class="settings-item" role="menuitemcheckbox" aria-checked="true">
          <span class="settings-item-label">
            <span class="settings-item-title">Legal move dots</span>
            <span class="settings-item-desc">Show destinations for the selected piece</span>
          </span>
          <input id="setting-show-dests" type="checkbox" checked />
          <span class="settings-switch" aria-hidden="true"></span>
        </label>
        <label class="settings-item" role="menuitemcheckbox" aria-checked="true">
          <span class="settings-item-label">
            <span class="settings-item-title">Side panel</span>
            <span class="settings-item-desc">Show the side panel</span>
          </span>
          <input id="setting-show-panel" type="checkbox" checked />
          <span class="settings-switch" aria-hidden="true"></span>
        </label>
        <div class="settings-divider" role="separator"></div>
        <div class="settings-item">
          <span class="settings-item-label">
            <span class="settings-item-title">Page style</span>
            <span class="settings-item-desc">Theme of the page and board</span>
          </span>
          <div class="settings-theme-buttons" role="group" aria-label="Page style">
            <button type="button" class="settings-theme-btn" data-theme-value="graphite" aria-pressed="false">Graphite</button>
            <button type="button" class="settings-theme-btn" data-theme-value="walnut" aria-pressed="true">Walnut</button>
            <button type="button" class="settings-theme-btn" data-theme-value="navy" aria-pressed="false">Navy</button>
            <button type="button" class="settings-theme-btn" data-theme-value="birch" aria-pressed="false">Birch</button>
            <button type="button" class="settings-theme-btn" data-theme-value="paper" aria-pressed="false">Paper</button>
          </div>
        </div>
        <div class="settings-divider" role="separator"></div>
        <div class="settings-item">
          <span class="settings-item-label">
            <span class="settings-item-title">Piece set</span>
            <span class="settings-item-desc">Pieces used on the board</span>
          </span>
          <div class="settings-theme-buttons" role="group" aria-label="Piece set">
            <button type="button" class="settings-theme-btn settings-piece-btn" data-piece-value="staunty" aria-pressed="true">Staunty</button>
            <button type="button" class="settings-theme-btn settings-piece-btn" data-piece-value="maestro" aria-pressed="false">Maestro</button>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
