<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FEN Viewer</title>
  </head>
  <body>
    <main>
      <div class="board-area">
        <div class="board-frame">
          <div class="coords-files" id="coords-files-top"></div>
          <div class="coords-ranks" id="coords-ranks-left"></div>
          <div id="board"></div>
          <div class="coords-ranks" id="coords-ranks-right"></div>
          <div class="move-indicator turn-black" id="move-indicator" title="Side to move"></div>
          <div class="coords-files" id="coords-files-bottom"></div>
        </div>
        <div class="fen-panel">
          <div class="fen-row">
            <input id="fen-input" type="text" spellcheck="false" autocomplete="off" placeholder="Paste a FEN string..." />
            <button id="lichess-btn" type="button" title="Analyze on Lichess" aria-label="Analyze on Lichess">
              <svg viewBox="0 0 50 50" aria-hidden="true">
                <path fill="currentColor" d="M38.956.5c-3.53.418-6.452.902-9.286 2.984C5.534 1.786-.692 18.533.68 29.364 3.493 50.214 31.918 55.785 41.329 41.7c-7.444 7.696-19.276 8.752-28.323 3.084S-.506 27.392 4.683 17.567C9.873 7.742 18.996 4.535 29.03 6.405c2.43-1.418 5.225-3.22 7.655-3.187l-1.694 4.86 12.752 21.37c-.439 5.654-5.459 6.112-5.459 6.112-.574-1.47-1.634-2.942-4.842-6.036-3.207-3.094-17.465-10.177-15.788-16.207-2.001 6.967 10.311 14.152 14.04 17.663 3.73 3.51 5.426 6.04 5.795 6.756 0 0 9.392-2.504 7.838-8.927L37.4 7.171z" />
              </svg>
            </button>
</div>
          <p id="fen-error" class="invalid-hint" hidden>Invalid FEN</p>
        </div>
      </div>
    </main>
    <div class="timer-widget">
      <button id="timer-toggle" type="button" title="Show timer" aria-label="Show timer" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M12 7v5l3 2M9 2h6M12 4a8 8 0 1 0 0 16 8 8 0 0 0 0-16Z" />
        </svg>
      </button>
      <div id="timer-panel" class="timer-panel" hidden>
        <span id="timer-display" class="timer-display">00:00</span>
        <button id="timer-startpause" type="button">Start</button>
        <button id="timer-reset" type="button">Reset</button>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
