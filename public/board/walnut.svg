    <feTurbulence type="fractalNoise" baseFrequency="2.4 0.6" numOctaves="5" seed="3" result="n"/>
    <feColorMatrix in="n" type="luminanceToAlpha" result="a"/>
    <feFlood flood-color="#7a5426" flood-opacity="1" result="c"/>
    <feComposite operator="in" in="c" in2="a" result="grain"/>
    <feComposite operator="in" in="grain" in2="SourceGraphic" result="m"/>
    <feBlend in="SourceGraphic" in2="m" mode="soft-light"/>
  </filter>
  <radialGradient id="soft" cx="0.5" cy="0.42" r="0.75">
    <stop offset="0" stop-color="#fff" stop-opacity="0.10"/>
    <stop offset="1" stop-color="#000" stop-opacity="0.14"/>
  </radialGradient>
</defs>
